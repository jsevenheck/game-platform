services:
  app:
    # Image is built and pushed to GHCR by the CI workflow, tagged with the
    # commit SHA. The deploy workflow injects IMAGE_TAG=<sha> so the VPS pulls
    # that exact, immutable image instead of rebuilding from source. Falls back
    # to :latest if IMAGE_TAG is unset (e.g. a manual `docker compose pull`).
    image: ghcr.io/jsevenheck/game-platform:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - '3002'
    env_file:
      - path: ./.env
        required: false
        format: raw
    environment:
      - NODE_ENV=production
      - PORT=3002
    # A memory ceiling turns "one runaway room exhausts the host" into "the
    # container restarts", which `restart: unless-stopped` above then handles.
    # Without it a single unbounded allocation takes the whole VPS with it.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    # Bound the log files too, so a noisy failure loop cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    labels:
      - traefik.enable=true

      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt

      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3002
