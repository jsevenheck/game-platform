name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit high-severity dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck game UIs
        run: pnpm typecheck:games

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify per-locale content assets
        run: |
          base=apps/platform/dist/server/games
          for l in en de; do
            test -s "$base/estimate/server/data/questions.$l.csv"
            test -s "$base/herd-mentality/server/data/prompts.$l.csv"
            test -s "$base/kritzelagent/server/data/topics.$l.csv"
            test -s "$base/imposter/server/data/words.$l.txt"
          done

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build the production image once, after tests pass, and push it to GHCR
  # tagged with the commit SHA. The deploy workflow then pins this exact tag,
  # so every deploy pulls a fresh, immutable image instead of relying on the
  # VPS to rebuild from source.
  publish-image:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
