name: Deploy to Hostinger VPS

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: game-platform-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5

      - name: Skip stale deployments
        id: freshness
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$DEPLOY_SHA" != "$latest_main_sha" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment $DEPLOY_SHA; main is at $latest_main_sha"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger
        if: steps.freshness.outputs.deploy == 'true'
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: game-platform
          docker-compose-path: docker-compose.yml
          environment-variables: |
            NODE_ENV=production
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            TRAEFIK_HOST=${{ secrets.TRAEFIK_HOST }}
