packages:
  - 'apps/*'
  - 'games/*'

overrides:
  diff: ^8.0.3
  esbuild: '>=0.25.0'
  shell-quote: ^1.11.0
  qs: 6.16.1
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'nanoid@<5': 3.3.18
  # GHSA-g3hv-75wg-m249: bound glob-pattern preprocessing in the ESLint dependency tree.
  'minimatch@>=7.0.0 <11.0.1': 11.0.1

allowBuilds:
  # v13 ships prebuilt N-API binaries (incl. linuxmusl), so no node-gyp build is needed.
  better-sqlite3: false
  esbuild: true

minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.2'
  - vue-tsc@3.3.2
